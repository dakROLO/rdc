name: RDC Operational Clarity Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/operational-clarity-subsite
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - feature/operational-clarity-subsite

jobs:
  build_and_deploy_job:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Test Site
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Package redesign test site
        run: node scripts/build-static.mjs --test
      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_FLOWER_03B86E810 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          production_branch: feature/operational-clarity-subsite
          app_location: dist
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Test Preview
    steps:
      - name: Close preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_FLOWER_03B86E810 }}
          action: close
